<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{% if page.title %}{{ page.title }} &middot; {% endif %}{{ site.title }}</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- Geist Mono, variable weight 100-900 -->
<link
  href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&display=swap"
  rel="stylesheet"
/>
<!-- Fallback: official Vercel `geist` package via jsDelivr, used only if
     Google Fonts is unavailable (blocked network, region, ad-blocker). -->
<style>
  @font-face {
    font-family: "Geist Mono Fallback";
    src: url("https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-mono/GeistMono-Variable.woff2") format("woff2-variations");
    font-weight: 100 900;
    font-display: swap;
  }
</style>

<!-- ?v= is a cache buster. Chrome caches file:// and localhost assets hard,
     so edits can appear to "do nothing". Bump this number after any change
     to the CSS/JS if a refresh doesn't seem to pick it up. -->
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v=20" />
</head>
<body>

<!-- backdrop used behind side panels -->
<div class="overlay" id="overlay"></div>

<!-- ============ TOP NAVIGATION ============ -->
<header class="navbar">
  <div class="nav-inner">
    <a href="{{ '/' | relative_url }}" class="logo">TH</a>
    <nav class="nav-links">
      <a class="nav-link{% if page.nav == 'gallery' %} is-current{% endif %}"
         href="{{ '/gallery/' | relative_url }}">Gallery</a>
      <button class="nav-link" id="aboutBtn" type="button">About Me</button>
    </nav>
  </div>
</header>

{{ content }}

<!-- ============ ABOUT PANEL ============
     Lives in the layout so it's reachable from every page. -->
<aside class="side-panel side-panel--about" id="aboutPanel" aria-hidden="true">
  <button class="side-panel__close" id="aboutPanelClose" type="button" aria-label="Close about panel">&times;</button>
  <div class="side-panel__content">
    <h2 class="side-panel__title">About Me</h2>
    <div class="side-panel__body">
      {% capture about_md %}{% include about.md %}{% endcapture %}
      {{ about_md | markdownify }}
    </div>
  </div>
</aside>

<!-- shader-header.js no-ops when the page has no #shader-header canvas;
     main.js guards each feature, so both are safe to load everywhere. -->
<script src="{{ '/assets/js/shader-header.js' | relative_url }}?v=20"></script>
<script src="{{ '/assets/js/main.js' | relative_url }}?v=20"></script>
{% if page.extra_js %}<script src="{{ page.extra_js | relative_url }}?v=20"></script>{% endif %}
</body>
</html>
